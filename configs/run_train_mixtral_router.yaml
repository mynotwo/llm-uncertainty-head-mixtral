hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  pretrained_model_name_or_path: mistralai/Mixtral-8x7B-Instruct-v0.1
  device_map: cuda
  trust_remote_code: true
  torch_dtype: torch.float16

ue_layer:
  path: ''
  pos_weight: 3
  output_attention: false
  head_cfg:
    head_type: claim
    feature_extractor:
    - name: luh.feature_extractors.mixtral_router_outputs
      layer_nums: all
      concat_mode: feature
      projection_dim: 768
    uncertainty_head:
      head_dim: 768
      n_layers: 2
      n_heads: 8
      dropout: 0.1

dataset:
  path: hf:llm-uncertainty-head/train_akimbio_mistral
  num_instances: 0
  test_size: 0.0
  validation: test

training_arguments:
  num_train_epochs: 10
  learning_rate: 0.0001
  warmup_ratio: 0.05
  weight_decay: 0.1
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 32
  max_grad_norm: 1.0

do_train: true
do_eval: true
do_hyperopt: false
do_save_checkpoints: true
do_save_final_model: true
report_to: none
output_dir: ./workdir/train

do_predict: false
